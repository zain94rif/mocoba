[workspace]
authors = ["Zainul Arifin <zainul_abc@yahoo.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
description = "Asisten AI kecil (jaringan neural + klasifikasi intent) yang ditulis 100% dengan Mojo."
name = "mocoba"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Demo utama: melatih MLP dari nol pada dataset XOR, spiral, dan blobs.
demo = "mojo run -I src apps/train_mlp.mojo"
# Asisten chat interaktif (juga bisa dipakai lewat pipe).
chatbot = "mojo run -I src apps/chatbot.mojo"
# Unit test.
test = "mojo run -I src tests/test_mojo_ai.mojo"
# Format semua kode sumber.
fmt = "mojo format src apps tests"
# Bangun binary mandiri (tidak perlu kompilasi ulang saat dijalankan).
build = { cmd = "mojo build -I src -o target/moc-demo apps/train_mlp.mojo && mojo build -I src -o target/moc-chat apps/chatbot.mojo", depends-on = ["build-dir"] }
build-dir = "mkdir -p target"

[dependencies]
mojo = ">=1.1.0,<2"
